; Standalone battery monitor for M5Stack CoreS3 + M5GO Bottom3.
; The CoreS3's AXP2101 PMIC reports the combined pack (internal cell +
; the Bottom3 battery wired in parallel), so M5Unified is all we need.

[env:m5stack-cores3]
platform = espressif32
framework = arduino
board = m5stack-cores3
monitor_speed = 115200
; Keep the ESP32-S3 native-USB CDC port up after boot so esptool can always
; auto-reset into download mode (otherwise the /dev/cu.* port vanishes once the
; app runs and every reflash needs a manual download-mode button press).
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps =
	m5stack/M5Unified@^0.2.17
	m5stack/M5GFX@^0.2.0
