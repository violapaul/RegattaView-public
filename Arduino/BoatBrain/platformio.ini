; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:node32s]
extends = common
board = node32s
build_flags = -Iinclude
lib_deps = 
	ttlappalainen/NMEA2000_esp32@^1.0.3
	hideakitai/DebugLog
	hideakitai/ArduinoEigen@^0.3.2
	ttlappalainen/NMEA2000-library@^4.21.2
	xylopyrographer/LiteLED @ ^1.2.0	



[env:m5stack-cores3]
extends = common
board = m5stack-cores3
build_flags =
    -DCORES3
    -Iinclude
    -DESP32_CAN_TX_PIN=GPIO_NUM_6
    -DESP32_CAN_RX_PIN=GPIO_NUM_14
lib_deps =
	m5stack/M5Unified@^0.2.17
	m5stack/M5GFX@^0.2.0
	hideakitai/ArduinoEigen@^0.3.2
	xylopyrographer/LiteLED @ ^1.2.0
	https://github.com/ttlappalainen/NMEA2000.git
	https://github.com/violapaul/NMEA2000_esp32_twai.git
	bblanchon/ArduinoJson@^7.0.0
lib_ldf_mode = deep+
board_build.partitions = default_16MB.csv	
