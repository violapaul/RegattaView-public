<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegattaView Sign-In</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            background: #f7f7f7;
            color: #222;
        }

        .card {
            background-color: #fff;
            padding: 32px 28px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            max-width: 360px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 4px 0;
        }

        .tagline {
            font-size: 13px;
            color: #666;
            margin: 0 0 22px 0;
        }

        .why {
            font-size: 13px;
            line-height: 1.5;
            color: #444;
            margin: 0 0 18px 0;
            text-align: left;
        }

        #signInButton {
            display: flex;
            justify-content: center;
            margin: 4px 0 14px 0;
        }

        #status {
            font-size: 13px;
            min-height: 20px;
            margin-top: 8px;
            color: #555;
        }

        #status.error {
            color: #b00020;
        }

        .footer {
            margin-top: 22px;
            padding-top: 14px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #777;
        }

        .footer a {
            color: #2a5d8f;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Welcome aboard</h1>
        <p class="tagline">Private 360° race replays for our sailing crew.</p>

        <p class="why">
            RegattaView is invite-only. If your email’s on the crew list,
            just sign in with Google and you’re in — no new password to
            remember.
        </p>

        <div id="signInButton"></div>
        <div id="status"></div>

        <p><a href="privacy.html">Privacy and shared access</a></p>
        <p class="footer">
            Not on the list yet? Email
            <a href="mailto:billey.viola@gmail.com">billey.viola@gmail.com</a>
            to be added.
        </p>
    </div>
</body>

</html>
